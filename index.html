<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro - Résiste</title>
  <style>
    body {
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .mic-button {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: orange;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .mic-icon svg {
      width: 26px;
      height: 26px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    .message {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
      text-align: center;
    }

    .valid {
      background-color: #48bb78 !important;
    }
  </style>
</head>
<body>

  <div id="mic" class="mic-button">
    <div class="mic-icon">
      <!-- Micro stylisé ligne blanche (Material-style, SVG fin) -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v6c0 1.66 1.34 3 3 3z"/>
        <path d="M19 11c0 3.87-3.13 7-7 7s-7-3.13-7-7"/>
        <line x1="12" y1="21" x2="12" y2="17"/>
        <line x1="9" y1="21" x2="15" y2="21"/>
      </svg>
    </div>
  </div>

  <div id="message" class="message">Clique et dis « résiste »</div>

  <script>
    const micBtn = document.getElementById("mic");
    const message = document.getElementById("message");

    micBtn.addEventListener("click", () => {
      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'fr-FR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      message.textContent = " Écoute en cours...";

      recognition.onresult = function(event) {
        const speech = event.results[0][0].transcript.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (speech.includes("resiste")) {
          micBtn.classList.add("valid");
          message.textContent = " Bravo !";
          message.style.color = "green";
        } else {
          message.textContent = " Ce n'était pas « résiste ». Réessaie.";
          message.style.color = "red";
        }
      };

      recognition.onerror = function() {
        message.textContent = "Erreur de reconnaissance.";
        message.style.color = "gray";
      };

      recognition.start();
    });
  </script>

</body>
</html>
