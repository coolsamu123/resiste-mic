<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    height: 100%;
    font-family: Arial, sans-serif;
  }
  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  .mic-button {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: orange;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
    transition: background-color .3s ease;
  }
  .mic-icon svg {
    width: 26px;
    height: 26px;
    stroke: white;
    fill: none;
    stroke-width: 2;
  }
  .listening { background: #3182ce !important; }
  .valid { background: #48bb78 !important; }
  .error { background: #e53e3e !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="mic" class="mic-button">
    <div class="mic-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5a3 3 0 0 0-6 0v6c0 1.66 1.34 3 3 3z"/>
        <path d="M19 11c0 3.87-3.13 7-7 7s-7-3.13-7-7"/>
        <line x1="12" y1="21" x2="12" y2="17"/>
        <line x1="9" y1="21" x2="15" y2="21"/>
      </svg>
    </div>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const motCible = (params.get("mot") || "resiste")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");

  const micBtn = document.getElementById("mic");
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---- Sons synthétisés ----
  let audioCtx;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  // bip court (clic)
  function playClick() {
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.value = 600;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.1);
  }

  // arpège ascendant joyeux (succès)
  function playSuccess() {
    const ctx = getCtx();
    const notes = [523.25, 659.25, 783.99]; // do, mi, sol
    notes.forEach((freq, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.value = freq;
      const t = ctx.currentTime + i * 0.12;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.2, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      o.connect(g).connect(ctx.destination);
      o.start(t);
      o.stop(t + 0.3);
    });
  }

  // buzz grave descendant (échec)
  function playError() {
    const ctx = getCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(220, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.35);
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  }

  micBtn.addEventListener("click", () => {
    if (!SR) return;

    playClick();

    micBtn.classList.remove("valid", "error");
    micBtn.classList.add("listening");

    const recognition = new SR();
    recognition.lang = "fr-FR";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (event) => {
      const speech = event.results[0][0].transcript
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
      micBtn.classList.remove("listening");
      if (speech.includes(motCible)) {
        micBtn.classList.add("valid");
        playSuccess();
      } else {
        micBtn.classList.add("error");
        playError();
      }
    };

    recognition.onerror = () => {
      micBtn.classList.remove("listening");
      micBtn.classList.add("error");
      playError();
    };

    recognition.start();
  });
</script>
</body>
</html>
